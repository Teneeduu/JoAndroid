name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.JO_KEYSTORE_BASE64 }}
        run: |
          # Every release must carry the same signature or phones refuse the
          # update, so never fall back to a throwaway debug key here.
          test -n "$KEYSTORE_BASE64" || { echo "JO_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jo-release.p12"

      - name: Build signed release APK
        env:
          JO_KEYSTORE_PATH: ${{ runner.temp }}/jo-release.p12
          JO_KEYSTORE_PASSWORD: ${{ secrets.JO_KEYSTORE_PASSWORD }}
          JO_KEY_ALIAS: jo
        run: gradle assembleRelease -PjoVersionCode=${{ github.run_number }} --stacktrace

      - name: Check signature and version
        run: |
          cp app/build/outputs/apk/release/app-release.apk Jo.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs Jo.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          "$BT/aapt2" dump badging Jo.apk | head -1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jo-apk
          path: Jo.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Jo.apk \
            --title "Jo build ${{ github.run_number }}" \
            --notes "Android 版 Jo。第一次用手机浏览器下载 Jo.apk 安装，之后在 App 里就能直接更新。commit: ${{ github.sha }}" \
            --latest

  screenshot:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Jo-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch Jo in an emulator and screenshot it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r Jo.apk
            adb shell am start -n com.teneeduu.jo/.MainActivity
            sleep 10
            adb exec-out screencap -p > screenshot.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Jo-screenshot
          path: screenshot.png
