name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.JO_KEYSTORE_BASE64 }}
        run: |
          # Every release must carry the same signature or phones refuse the
          # update, so never fall back to a throwaway debug key here.
          test -n "$KEYSTORE_BASE64" || { echo "JO_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jo-release.p12"

      - name: Build signed release APK
        env:
          JO_KEYSTORE_PATH: ${{ runner.temp }}/jo-release.p12
          JO_KEYSTORE_PASSWORD: ${{ secrets.JO_KEYSTORE_PASSWORD }}
          JO_KEY_ALIAS: jo
        run: gradle testReleaseUnitTest assembleRelease -PjoVersionCode=${{ github.run_number }} --stacktrace

      - name: Unit test summary
        run: grep -h -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' app/build/test-results/testReleaseUnitTest/*.xml

      - name: Check signature and version
        run: |
          cp app/build/outputs/apk/release/app-release.apk Jo.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "build-tools: $BT"
          "$BT/apksigner" verify --print-certs Jo.apk | tee signer.txt
          # The one key every release must carry. An APK signed with anything else
          # could never update the copies already on phones, so stop before publishing.
          grep -qi "7addc3d3170997fa3385a9773404e75f4d169617c4d32a28dcde42abbcfb4216" signer.txt \
            || { echo "APK is not signed with the Jo release key"; exit 1; }
          "$BT/aapt2" dump badging Jo.apk | head -1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jo-apk
          path: Jo.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Jo.apk \
            --title "Jo build ${{ github.run_number }}" \
            --notes "Android 版 Jo。第一次用手机浏览器下载 Jo.apk 安装，之后在 App 里就能直接更新。commit: ${{ github.sha }}" \
            --latest

  screenshot:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Jo-apk

      - name: Make sample photos
        run: python3 scripts/make_sample_photos.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch Jo in an emulator and screenshot it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r Jo.apk
            adb shell mkdir -p /sdcard/DCIM/Camera /sdcard/Pictures/Screenshots
            adb push sample1.png sample2.png sample3.png /sdcard/DCIM/Camera/
            adb push sample1.png /sdcard/Pictures/Screenshots/not-a-camera-photo.png
            adb shell content call --uri content://media --method scan_volume --arg external_primary || true
            adb shell pm grant com.teneeduu.jo android.permission.READ_MEDIA_IMAGES
            adb shell pm grant com.teneeduu.jo android.permission.POST_NOTIFICATIONS
            adb shell am start -n com.teneeduu.jo/.MainActivity
            sleep 12
            adb exec-out screencap -p > screenshot.png
            sh scripts/tap-text.sh "播放音乐"
            sleep 5
            adb shell dumpsys media_session > media_session.txt
            sh scripts/tap-text.sh "设置"
            sleep 3
            adb exec-out screencap -p > screenshot-settings.png
            sh scripts/tap-text.sh "发一条试试"
            sleep 3
            adb shell dumpsys notification --noredact > notifications.txt
            adb shell cmd statusbar expand-notifications
            sleep 3
            adb exec-out screencap -p > screenshot-notification.png
            adb shell cmd statusbar collapse

      - name: Show Jo's media session and notifications
        run: |
          grep -A 15 "com.teneeduu.jo" media_session.txt | grep -E "package=|active=|state=" | head -8 || true
          grep -E "pkg=com.teneeduu.jo|android.title=|android.text=" notifications.txt | head -12 || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Jo-screenshot
          path: |
            screenshot*.png
            media_session.txt
            notifications.txt
